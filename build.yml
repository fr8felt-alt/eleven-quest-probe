name: Build Eleven Quest Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get Scotland2 headers
        run: git clone --depth 1 https://github.com/sc2ad/scotland2.git external/scotland2
      - name: Configure Android NDK
        run: |
          set -e
          if ! ls "$ANDROID_HOME"/ndk/*/build/cmake/android.toolchain.cmake >/dev/null 2>&1; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' || true
          fi
          NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
      - name: Configure and compile
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --verbose
      - name: Create QMOD
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          so=Path('build/libeleven_quest_probe.so')
          assert so.is_file(), 'Biblioteca nao foi gerada'
          with zipfile.ZipFile('ElevenQuestProbe.qmod', 'w', compression=zipfile.ZIP_DEFLATED, allowZip64=False) as z:
              z.write('mod.json', arcname='mod.json')
              z.write(so, arcname=so.name)
          print(f'QMOD criado: {Path("ElevenQuestProbe.qmod").stat().st_size} bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ElevenQuestProbe-qmod
          path: ElevenQuestProbe.qmod
